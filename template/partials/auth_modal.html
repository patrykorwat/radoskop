<div id="auth-modal-backdrop" class="modal-backdrop" style="display:none" onclick="closeAuthModalIfBackdrop(event)">
  <div class="auth-modal" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeAuthModal()" aria-label="Zamknij">×</button>
    <div class="auth-tabs">
      <button class="auth-tab active" id="auth-tab-login" onclick="setAuthMode('login')">Logowanie</button>
      <button class="auth-tab" id="auth-tab-signup" onclick="setAuthMode('signup')">Rejestracja</button>
    </div>
    <button class="google-btn" onclick="googleLogin()">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285f4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34a853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#fbbc05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.997 8.997 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#ea4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      Kontynuuj z Google
    </button>
    <div class="auth-sep"><span>lub e-mailem</span></div>
    <form class="auth-form" onsubmit="return submitAuth(event)">
      <input type="email" id="auth-email" placeholder="E-mail" required autocomplete="email">
      <input type="password" id="auth-password" placeholder="Hasło (min. 10 znaków)" required autocomplete="current-password" minlength="10">
      <button type="submit" id="auth-submit">Zaloguj się</button>
      <div id="auth-error" class="auth-error" style="display:none"></div>
      <div id="auth-success" class="auth-success" style="display:none"></div>
    </form>
    <div class="auth-footer">
      <a href="#" id="auth-forgot-link" onclick="forgotPassword(); return false;">Zapomniałem hasła</a>
    </div>
  </div>
</div>

<!-- Verification banner (po /verify redirect z ?verified=1) -->
<div id="auth-banner" class="auth-banner" style="display:none"></div>
