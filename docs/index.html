<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radoskop — przenosimy się na radoskop.eu</title>
<link rel="canonical" href="https://radoskop.eu/">
<meta name="robots" content="noindex, follow">
<!-- radoskop.pl (apex) przekierowuje na radoskop.eu. Subdomeny miast
     (np. warszawa.radoskop.pl) działają niezależnie i nie są tu objęte.
     Język: .eu wykrywa referrer z radoskop.pl i pokazuje polski. -->
<meta http-equiv="refresh" content="0; url=https://radoskop.eu/?lang=pl">
<script>
  try {
    var q = new URLSearchParams(location.search);
    var lang = (q.get('lang') === 'en') ? 'en' : 'pl';
    location.replace('https://radoskop.eu/?lang=' + lang);
  } catch (e) {
    location.replace('https://radoskop.eu/?lang=pl');
  }
</script>
<style>
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f8f9fa; color:#1a1d27; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .box { text-align:center; padding:24px; }
  a { color:#4f46e5; }
  @media (prefers-color-scheme: dark) { body { background:#0f1117; color:#e4e4e7; } a { color:#818cf8; } }
</style>
</head>
<body>
  <div class="box">
    <p>Radoskop przeniósł się na <a href="https://radoskop.eu/?lang=pl">radoskop.eu</a>.</p>
    <p>Radoskop has moved to <a href="https://radoskop.eu/?lang=en">radoskop.eu</a>.</p>
  </div>
</body>
</html>
